name: Build REMINDLY APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'REMINDLY_*_source.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'REMINDLY_*_source.zip' | sort -V | tail -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: REMINDLY-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
